name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l
      - name: Install test tooling
        if: matrix.php == '8.2'
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit tests
        if: matrix.php == '8.2'
        run: composer test:unit
      - name: WordPress coding standards
        if: matrix.php == '8.2'
        run: composer lint

  wordpress-integration:
    name: WordPress ${{ matrix.wordpress }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.8.6', '6.9.5', '7.0.2']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli
          tools: composer:v2
      - name: Install test tooling
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Install WordPress test suite
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/wp-cli/scaffold-command/main/templates/install-wp-tests.sh \
            --output /tmp/install-wp-tests.sh
          bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "$WP_VERSION" true
      - name: Integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:integration
